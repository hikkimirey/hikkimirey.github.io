<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблиця лідерів - SpeedType</title>
    <link rel="stylesheet" href="styleleaderboard.css">
</head>
<body>
    <!-- Шапка сайту -->
    <header>
        <div class="container">
            <h1 class="site-title">SpeedType</h1>
            <p class="site-subtitle">Покращуй свої навички друку!</p>
        </div>
    </header>

    <!-- Навігаційне меню -->
    <nav class="main-nav">
        <div class="container">
            <ul class="nav-menu">
                <li><a href="../../index.html" class="nav-link">Головна</a></li>
                <li><a href="leaderboard.html" class="nav-link active">Таблиця лідерів</a></li>
                <li><a href="../about/about.html" class="nav-link">Про нас</a></li>
                <li><a href="../contacts/contacts.html" class="nav-link">Контакти</a></li>
                <li><a href="../register/register.html" class="nav-link">Реєстрація</a></li>
                <li><a href="../profile/profile.html" class="nav-link">Особистий кабінет</a></li>
            </ul>
        </div>
    </nav>

    <!-- Головний контент -->
    <main class="main-content">
        <div class="container">
            <section class="leaderboard-header">
                <h2>🏆 Таблиця лідерів</h2>
                <p>Топ найшвидших друкарів</p>
                
                <!-- Фільтри -->
                <div class="leaderboard-filters">
                    <button class="filter-btn active" data-mode="weekly">За тижднем</button>
                    <button class="filter-btn" data-mode="monthly">За місяцем</button>
                    <button class="filter-btn" data-mode="alltime">За весь час</button>
                    <select class="mode-select" id="gameMode">
                        <option value="all">Всі режими</option>
                        <option value="classic">Класичний режим</option>
                        <option value="timed">На час</option>
                        <option value="obstacles">З перешкодами</option>
                    </select>
                </div>
            </section>

            <!-- Таблиця лідерів -->
            <section class="leaderboard-table">
                <div class="table-header">
                    <div class="rank-col">Місце</div>
                    <div class="player-col">Гравець</div>
                    <div class="speed-col">Швидкість</div>
                    <div class="accuracy-col">Точність</div>
                    <div class="points-col">Очки</div>
                    <div class="games-col">Ігор</div>
                </div>

                <div class="table-body" id="leaderboardBody">
                    <!-- Дані будуть завантажені через JavaScript -->
                    <div class="loading">Завантаження даних...</div>
                </div>
            </section>

            <!-- Статистика -->
            <section class="leaderboard-stats">
                <div class="stats-grid" id="statsGrid">
                    <!-- Статистика буде оновлена через JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <!-- Футер -->
    <footer class="footer">
        <!-- Футер залишається незмінним -->
    </footer>

    <script src="js/leaderboard.js"></script>
</body>
</html>
